<!doctype html>
<html lang="fi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <title>Viimeinen yöbussi</title>
    <meta name="description" content="Pidä silmät auki ja jää pois oikealla pysäkillä." />
    <meta name="theme-color" content="#0b0d1a" />
    <link rel="icon" type="image/png" href="/icons/favicon-64.png" />
    <!-- iOS: home screen app without Safari bars; content runs under the status bar (safe area below). -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Yöbussi" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }
      /* Keep the game clear of the notch and home indicator. */
      #game {
        position: fixed;
        top: env(safe-area-inset-top);
        right: env(safe-area-inset-right);
        bottom: env(safe-area-inset-bottom);
        left: env(safe-area-inset-left);
      }
      #rotate {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #0b0d1a;
        color: #ffd166;
        font: 600 22px sans-serif;
        text-align: center;
      }
      #rotate .phone {
        width: 44px;
        height: 76px;
        border: 4px solid #ffd166;
        border-radius: 10px;
        animation: turn 2s ease-in-out infinite;
      }
      @keyframes turn {
        0%, 30% { transform: rotate(0deg); }
        60%, 100% { transform: rotate(-90deg); }
      }
      /* Touch devices held upright: ask to turn (iOS ignores the manifest orientation). */
      @media (orientation: portrait) and (pointer: coarse) {
        #rotate {
          display: flex;
        }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate" aria-live="polite"><div class="phone"></div><div class="text"></div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
